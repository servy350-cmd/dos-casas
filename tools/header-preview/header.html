<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header — ESSENCIA LUXXE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold-dark:#8A6D2F;
    --gold:#C9A24B;
    --gold-light:#E8C874;
    --gold-bright:#F5D98A;
    --black:#0a0a0a;
    --cream:#F0E6D2;
    --ink:#1a1a1a;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#1c1c1c;
  }

  .site-header{
    width:100%;
    /* position:sticky; top:0; z-index:100; */
  }

  /* ── Franja superior: beneficios ─────────────────────────── */
  .benefits-bar{
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(90deg,
      var(--gold-dark) 0%,
      #A8853C 18%,
      var(--gold-light) 42%,
      var(--gold-bright) 50%,
      var(--gold-light) 58%,
      #A8853C 82%,
      var(--gold-dark) 100%);
  }
  .benefit{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 22px;
    color:var(--ink);
    font-size:13px;
    font-weight:500;
    letter-spacing:.06em;
    white-space:nowrap;
  }
  .benefit + .benefit{
    border-left:1px solid rgba(26,26,26,.35);
  }
  .benefit svg{
    width:16px;
    height:16px;
    flex-shrink:0;
    stroke:var(--ink);
  }

  /* ── Franja inferior: header principal ───────────────────── */
  .main-bar{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    background:var(--black);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
  }
  .brand .drop{
    width:34px;
    height:44px;
    flex-shrink:0;
  }
  .wordmark{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:22px;
    letter-spacing:.22em;
    white-space:nowrap;
  }
  .wordmark .w1{
    color:var(--cream);
    font-weight:600;
  }
  .wordmark .w2{
    color:var(--gold-light);
    font-style:italic;
    font-weight:500;
    margin-left:.28em;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .icon-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    background:none;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:var(--gold-light);
    transition:color .18s ease;
  }
  .icon-btn:hover{color:#ffffff}
  .icon-btn:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }
  .icon-btn svg{
    width:22px;
    height:22px;
    stroke:currentColor;
  }
  /* Badge del carrito: lee data-count del boton */
  .cart-btn::after{
    content:attr(data-count);
    position:absolute;
    top:2px;
    right:2px;
    min-width:17px;
    height:17px;
    padding:0 4px;
    border-radius:9px;
    background:var(--gold-light);
    color:var(--ink);
    font-size:11px;
    font-weight:700;
    line-height:17px;
    text-align:center;
  }

  /* ── Responsive ──────────────────────────────────────────── */
  @media (max-width:767px){
    .benefit{padding:0 16px}
    .benefit span{display:none}          /* solo iconos en movil */
    .benefit svg{width:18px;height:18px}
    .main-bar{padding:0 16px}
    .wordmark{font-size:18px;letter-spacing:.16em}
    .brand .drop{width:28px;height:37px}
    .controls{gap:4px}
  }
</style>
</head>
<body>

<header class="site-header">

  <!-- Franja superior: beneficios -->
  <div class="benefits-bar">
    <div class="benefit" aria-label="Envíos a toda Colombia">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 5h13v11H1z"/><path d="M14 9h4l4 4v3h-8"/>
        <circle cx="6" cy="18.5" r="2"/><circle cx="18" cy="18.5" r="2"/>
      </svg>
      <span>Envíos a toda Colombia</span>
    </div>
    <div class="benefit" aria-label="Despacho en 24 horas">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v9"/><path d="M7.5 5.5l9 5"/>
      </svg>
      <span>Despacho en 24 h</span>
    </div>
    <div class="benefit" aria-label="Pago seguro">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
      </svg>
      <span>Pago seguro</span>
    </div>
  </div>

  <!-- Franja inferior: header principal -->
  <div class="main-bar">

    <a class="brand" href="#" aria-label="ESSENCIA LUXXE — inicio">
      <svg class="drop" viewBox="0 0 34 44" aria-hidden="true">
        <defs>
          <linearGradient id="dropGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F5D98A"/>
            <stop offset=".45" stop-color="#E8C874"/>
            <stop offset="1" stop-color="#B8892F"/>
          </linearGradient>
          <radialGradient id="dropShine" cx=".35" cy=".3" r=".5">
            <stop offset="0" stop-color="#FFF6DC" stop-opacity=".95"/>
            <stop offset="1" stop-color="#FFF6DC" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path d="M17 2 C17 2 30 20 30 30 A13 13 0 0 1 4 30 C4 20 17 2 17 2 Z" fill="url(#dropGold)"/>
        <ellipse cx="12" cy="24" rx="5.5" ry="8" fill="url(#dropShine)"/>
      </svg>
      <span class="wordmark"><span class="w1">ESSENCIA</span><span class="w2">LUXXE</span></span>
    </a>

    <div class="controls">
      <button class="icon-btn" type="button" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>
        </svg>
      </button>
      <button class="icon-btn cart-btn" type="button" aria-label="Carrito" data-count="0">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/>
          <path d="M2.5 3.5h3l2.6 12h10.4l2-8.5H6.2"/>
        </svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Menú">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
    </div>

  </div>
</header>

<script>
  // Numero del carrito: cambiar aqui (o setear data-count directo en el boton).
  const CART_COUNT = 0;
  document.querySelector('.cart-btn').dataset.count = CART_COUNT;
</script>

</body>
</html>
